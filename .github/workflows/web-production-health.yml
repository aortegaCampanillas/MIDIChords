# Comprueba cada hora que freemidichords.com sirve HTML, CSS, JS y /api/meta.
# También se ejecuta al terminar con éxito "Deploy Cloudflare (Production)" (evita
# solaparse con el deploy en curso). Si falla, envía correo vía Resend.
name: Web production health

on:
  schedule:
    # Cada hora (UTC), minuto 12 para no coincidir con el arranque en punto
    - cron: "12 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy Cloudflare (Production)"
    types:
      - completed

# Una sola ejecución a la vez: si coinciden cron y post-deploy, la segunda espera.
concurrency:
  group: web-production-health
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-web-production:
    name: Check HTML, CSS, JS and API
    runs-on: ubuntu-latest
    # Tras un deploy fallido no tiene sentido el chequeo “post-deploy”; cron y manual siguen.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enfriar CDN tras despliegue (solo post-deploy)
        if: github.event_name == 'workflow_run'
        run: |
          echo "Esperando 90s para propagación en Cloudflare tras el deploy..."
          sleep 90

      # No usar `if: secrets.*` aquí: GitHub rechaza el workflow al parsearlo (422).
      - name: Aviso si falta secret RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "::warning::Define el secret RESEND_API_KEY (Settings → Secrets and variables → Actions) para recibir correo cuando falle el chequeo. Sin él el job sigue fallando pero no se envía aviso."
          fi

      - name: Run production web health checks
        run: |
          set -euo pipefail
          python3 scripts/check_production_web_health.py 2>&1 | tee web-health.log

      - name: Email alert on failure
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM_EMAIL }}
          ALERT_TO: ${{ vars.WEB_HEALTH_ALERT_TO }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "RESEND_API_KEY not set — no se puede enviar correo de aviso."
            exit 0
          fi
          python3 scripts/send_resend_health_alert.py web-health.log
