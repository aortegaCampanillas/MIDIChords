id: com.freemidichords.MIDIChords
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: midichords
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-config/MIDIChords:create
  - --filesystem=xdg-data/applications:ro
  - --share=network
modules:
  # Primero PortAudio, después dependencias Python, para que sounddevice
  # pueda compilar su extensión nativa contra la librería ya instalada.
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def
  - python-deps.json
  - name: midichords-launcher
    buildsystem: simple
    build-commands:
      - export PYTHONPATH="/app/lib/python3.12/site-packages${PYTHONPATH:+:$PYTHONPATH}"
      - pyinstaller --noconfirm --clean --onefile --windowed --name MIDIChords --add-data "assets:assets" --hidden-import _sounddevice app.py
      - install -Dm755 dist/MIDIChords /app/bin/midichords
      - install -Dm644 packaging/flatpak/com.freemidichords.MIDIChords.desktop /app/share/applications/com.freemidichords.MIDIChords.desktop
      - install -Dm644 packaging/flatpak/com.freemidichords.MIDIChords.metainfo.xml /app/share/metainfo/com.freemidichords.MIDIChords.metainfo.xml
      # El logo original es 1024x1024, por eso se instala en el tamaño 1024x1024.
      - install -Dm644 assets/app_logo.png /app/share/icons/hicolor/1024x1024/apps/com.freemidichords.MIDIChords.png
    sources:
      - type: dir
        path: ../../
