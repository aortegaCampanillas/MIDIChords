# Comprueba cada hora que freemidichords.com sirve HTML, CSS, JS y /api/meta.
# Si falla, envía correo vía Resend (mismo secret que otros workflows).
name: Web production health

on:
  schedule:
    # Cada hora (UTC), minuto 12 para no coincidir con el arranque en punto
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-web-production:
    name: Check HTML, CSS, JS and API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No usar `if: secrets.*` aquí: GitHub rechaza el workflow al parsearlo (422).
      - name: Aviso si falta secret RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "::warning::Define el secret RESEND_API_KEY (Settings → Secrets and variables → Actions) para recibir correo cuando falle el chequeo. Sin él el job sigue fallando pero no se envía aviso."
          fi

      - name: Run production web health checks
        run: |
          set -euo pipefail
          python3 scripts/check_production_web_health.py 2>&1 | tee web-health.log

      - name: Email alert on failure
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM_EMAIL }}
          ALERT_TO: ${{ vars.WEB_HEALTH_ALERT_TO }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "RESEND_API_KEY not set — no se puede enviar correo de aviso."
            exit 0
          fi
          python3 scripts/send_resend_health_alert.py web-health.log
