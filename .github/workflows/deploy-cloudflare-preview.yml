name: Deploy Cloudflare Preview

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  deploy-web-preview:
    name: Deploy Web Preview to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve preview branch
        id: ref
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "branch=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare static web bundle
        run: python3 scripts/build_web_pages_dist.py

      - name: Verificar bundle Pages (worker, rutas y JSON)
        run: |
          set -euo pipefail
          test -f apps/web/pages-dist/_worker.js
          test -f apps/web/pages-dist/_routes.json
          python3 -c "import json; d=json.load(open('apps/web/pages-dist/_routes.json')); assert d.get('include')==['/*'], d"

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy apps/web/pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ steps.ref.outputs.branch }}
