name: Build Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publicar (ej: v1.0.2). Si se deja vacío, no se sincroniza al repo público."
        required: false
        type: string
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUBLIC_RELEASES_REPO: aortegaCampanillas/FreeMIDIChords_Releases

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MIDIChords --add-data "assets;assets" app.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          @"
          [Setup]
          AppId={{A4F55F54-4AA1-4A4F-B112-0F7A2755CE16}
          AppName=MIDIChords
          AppVersion=${{ github.ref_name }}
          AppVerName=MIDIChords ${{ github.ref_name }}
          AppPublisher=Antonio Ortega González
          DefaultDirName={autopf}\MIDIChords
          DefaultGroupName=MIDIChords
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=MIDIChords-windows-installer-x64
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"

          [Files]
          Source: "dist\MIDIChords.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\MIDIChords"; Filename: "{app}\MIDIChords.exe"
          Name: "{autodesktop}\MIDIChords"; Filename: "{app}\MIDIChords.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\MIDIChords.exe"; Description: "Launch MIDIChords"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path installer.iss -Encoding UTF8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Build MSIX package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v') -replace '^(\d+\.\d+\.\d+)$','$1.0'
          if ($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { $ver = "1.0.0.0" }
          New-Item -ItemType Directory -Force -Path msix_stage\Assets | Out-Null
          Copy-Item -Path dist\MIDIChords.exe -Destination msix_stage\MIDIChords.exe
          Copy-Item -Path assets\app_logo.png -Destination msix_stage\Assets\StoreLogo.png
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:desktop="http://schemas.microsoft.com/appx/manifest/desktop/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="Antonioortega.FreeMIDIPianoGuitarChords" Publisher="CN=E70C548D-768A-4F80-B0D6-41DB1F7A402F" Version="$ver" ProcessorArchitecture="x64"/>
            <Properties>
              <DisplayName>Free MIDI Piano&amp;Guitar Chords</DisplayName>
              <PublisherDisplayName>Antonio ortega</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0"/>
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust"/>
            </Capabilities>
            <Resources>
              <Resource Language="en-us"/>
            </Resources>
            <Applications>
              <Application Id="MIDIChords" Executable="MIDIChords.exe" EntryPoint="windows.fullTrustApplication">
                <uap:VisualElements DisplayName="Free MIDI Piano&amp;Guitar Chords" Description="Acordes MIDI para piano y guitarra" Square44x44Logo="Assets\StoreLogo.png" Square150x150Logo="Assets\StoreLogo.png" BackgroundColor="transparent"/>
                <Extensions>
                  <desktop:Extension Category="windows.fullTrustProcess" Executable="MIDIChords.exe">
                    <desktop:FullTrustProcess/>
                  </desktop:Extension>
                </Extensions>
              </Application>
            </Applications>
          </Package>
          "@
          $manifest | Set-Content -Path msix_stage\AppxManifest.xml -Encoding UTF8
          $sdkBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdkBin) { throw "Windows SDK bin not found" }
          & "$sdkBin\x64\MakeAppx.exe" pack /d msix_stage /p MIDIChords-windows-x64.msix /l

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            MIDIChords-windows-installer-x64.exe
            MIDIChords-windows-x64.msix

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug vars (firma macOS)
        run: echo "SIGN_MACOS=[${{ vars.SIGN_MACOS }}]" && if [ "${{ vars.SIGN_MACOS }}" = "true" ]; then echo "Se ejecutará firma y notarización"; else echo "Se generará DMG sin firma"; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --windowed --name MIDIChords --add-data "assets:assets" app.py

      - name: Build installer (.dmg) (sin firma)
        if: ${{ vars.SIGN_MACOS != 'true' }}
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R dist/MIDIChords.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MIDIChords" -srcfolder dmg-root -ov -format UDZO MIDIChords-macos.dmg

      - name: Import certificate and sign + notarize
        if: ${{ vars.SIGN_MACOS == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="actions"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "AC_NOTARY" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

          scripts/sign_notarize_macos.sh \
            --skip-build \
            --skip-icon \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --bundle-id "$MACOS_BUNDLE_ID" \
            --notary-profile "AC_NOTARY"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: MIDIChords-macos.dmg

  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev dpkg-dev fakeroot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --name MIDIChords --add-data "assets:assets" app.py

      - name: Build .deb package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKGROOT="package-root"
          mkdir -p "$PKGROOT/DEBIAN"
          mkdir -p "$PKGROOT/opt/midichords"
          mkdir -p "$PKGROOT/usr/share/applications"
          mkdir -p "$PKGROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 dist/MIDIChords "$PKGROOT/opt/midichords/MIDIChords"
          install -m 644 assets/app_logo.png "$PKGROOT/usr/share/icons/hicolor/256x256/apps/midichords.png"

          cat > "$PKGROOT/DEBIAN/control" <<CONTROL
          Package: midichords
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Antonio Ortega González
          Depends: libasound2, libjack-jackd2-0 | libjack0
          Description: MIDI Chords Analyzer desktop application
           Real-time MIDI chord analyzer with staff and piano visualization.
          CONTROL

          cat > "$PKGROOT/usr/share/applications/midichords.desktop" <<DESKTOP
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=MIDI Chords Analyzer
          Comment=Real-time MIDI chord analyzer
          Exec=/opt/midichords/MIDIChords
          Icon=midichords
          Terminal=false
          Categories=Audio;Music;
          DESKTOP

          dpkg-deb --build "$PKGROOT" "MIDIChords-debian-amd64.deb"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: MIDIChords-debian-amd64.deb

  sync-public-release:
    name: Sync installers to public releases repo
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-debian

    steps:
      - name: Download release assets from this repo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" \
            --repo "$SOURCE_REPO" \
            --dir out \
            --pattern 'MIDIChords-*.dmg' \
            --pattern 'MIDIChords-*.exe' \
            --pattern 'MIDIChords-*.msix' \
            --pattern 'MIDIChords-*.deb'
          ls -la out

      - name: Publish release in public repo (same tag)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.PUBLIC_RELEASES_REPO }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Create the release if it doesn't exist yet (this also creates the tag in the target repo).
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Public release already exists: $REPO@$TAG"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "MIDIChords $TAG" \
              --notes "Artefactos de escritorio para $TAG.\n\nCódigo fuente: https://github.com/$SOURCE_REPO/tree/$TAG"
          fi

          # Upload/replace assets
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
