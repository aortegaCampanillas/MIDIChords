name: Deploy Cloudflare (Tag)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-web-pages:
    name: Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static web bundle
        run: |
          rm -rf apps/web/pages-dist
          mkdir -p apps/web/pages-dist/static
          cp apps/web/templates/index.html apps/web/pages-dist/index.html
          cp -R apps/web/static/. apps/web/pages-dist/static/
          test -f apps/web/pages-dist/static/app.js
          test -f apps/web/pages-dist/static/style.css
          test -f apps/web/functions/api/health.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy apps/web/pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --functions=apps/web/functions
