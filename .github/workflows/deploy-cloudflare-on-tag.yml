name: Deploy Cloudflare (Production)

# Producción solo con etiquetas: no se dispara con push a main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  deploy-web-pages:
    name: Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      # Siempre desplegar desde main: así un tag (nuevo o movido) no despliega
      # un commit antiguo y no rompe producción.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare static web bundle
        run: |
          rm -rf apps/web/pages-dist
          mkdir -p apps/web/pages-dist/static
          cp apps/web/index.html apps/web/pages-dist/index.html
          cp -R apps/web/static/. apps/web/pages-dist/static/
          cp apps/web/worker/_worker.js apps/web/pages-dist/_worker.js
          # Cloudflare Pages headers (evita cache de HTML/CSS/JS tras deploy)
          if [ -f apps/web/_headers ]; then cp apps/web/_headers apps/web/pages-dist/_headers; fi
          test -f apps/web/pages-dist/index.html
          test -f apps/web/pages-dist/static/app.js
          test -f apps/web/pages-dist/static/style.css
          test -f apps/web/pages-dist/_worker.js

      - name: Deploy to Cloudflare Pages
        id: deploy_primary
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy apps/web/pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

      - name: Smoke test production API
        id: smoke_primary
        continue-on-error: true
        run: |
          set -euo pipefail
          url='https://freemidichords.com/api/meta?language=es'
          for attempt in $(seq 1 18); do
            echo "Smoke test attempt ${attempt}/18: ${url}"
            if body="$(curl -fsS "$url")" && echo "$body" | grep -q '"chord_patterns"'; then
              echo "Production API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Production API did not become healthy after deploy."
          exit 1

      - name: Retry Cloudflare Pages deploy
        if: steps.smoke_primary.outcome != 'success'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy apps/web/pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

      - name: Verify production API after retry
        if: steps.smoke_primary.outcome != 'success'
        run: |
          set -euo pipefail
          url='https://freemidichords.com/api/meta?language=es'
          for attempt in $(seq 1 18); do
            echo "Post-retry smoke test attempt ${attempt}/18: ${url}"
            if body="$(curl -fsS "$url")" && echo "$body" | grep -q '"chord_patterns"'; then
              echo "Production API is healthy after retry."
              exit 0
            fi
            sleep 10
          done
          echo "Production API still failing after retry."
          exit 1

      - name: Notify maintainer on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM_EMAIL }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then echo "RESEND_API_KEY not set, skipping email"; exit 0; fi
          python3 -c "
          import os, json, urllib.request
          url = os.environ.get('GITHUB_SERVER_URL', 'https://github.com') + '/' + os.environ.get('GITHUB_REPOSITORY', '') + '/actions/runs/' + os.environ.get('GITHUB_RUN_ID', '')
          payload = {
            'from': os.environ.get('NOTIFY_FROM', 'MIDIChords <onboarding@resend.dev>'),
            'to': ['aortega98@gmail.com'],
            'subject': f\"GitHub Action falló: {os.environ.get('GITHUB_WORKFLOW', '')} #\" + os.environ.get('GITHUB_RUN_ID', ''),
            'html': f\"<p>El workflow <strong>{os.environ.get('GITHUB_WORKFLOW', '')}</strong> falló.</p><p><a href='{url}'>Ver run</a></p>\"
          }
          r = urllib.request.Request('https://api.resend.com/emails',
            data=json.dumps(payload).encode(),
            headers={'Authorization': f\"Bearer {os.environ['RESEND_API_KEY']}\", 'Content-Type': 'application/json'},
            method='POST')
          urllib.request.urlopen(r)
          "
