# Comprueba cada hora que freemidichords.com sirve HTML, CSS, JS y /api/meta.
# Si falla el 1er chequeo: despliega de nuevo Pages desde `main` (mismo bundle que el deploy
# por etiqueta), espera propagación y vuelve a comprobar. El correo (Resend) indica en el
# **asunto** si quedó resuelto o hace falta intervención manual.
# También se ejecuta al terminar con éxito "Deploy Cloudflare (Production)".
name: Web production health

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy Cloudflare (Production)"
    types:
      - completed

concurrency:
  group: web-production-health
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WEB_HEALTH_RETRIES: "4"

jobs:
  check-web-production:
    name: Check web, autocuración y correo
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Enfriar CDN tras despliegue (solo post-deploy)
        if: github.event_name == 'workflow_run'
        run: |
          echo "Esperando 120s para propagación en Cloudflare tras el deploy (worker / dominio personalizado)..."
          sleep 120

      - name: Aviso si falta secret RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "::warning::Define RESEND_API_KEY para correo tras fallos. Sin él el job puede fallar sin aviso por email."
          fi

      - name: Chequeo de salud (intento 1)
        id: health1
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_production_web_health.py 2>&1 | tee web-health-1.log

      - name: Preparar bundle Pages (autocuración)
        id: bundle
        if: steps.health1.outcome == 'failure'
        run: |
          set -euo pipefail
          python3 scripts/build_web_pages_dist.py
          test -f apps/web/pages-dist/_worker.js
          test -f apps/web/pages-dist/_routes.json
          python3 -c "import json; d=json.load(open('apps/web/pages-dist/_routes.json')); assert d.get('include')==['/*'], d"

      - name: Redeploy Cloudflare Pages (autocuración)
        id: deploy
        if: steps.health1.outcome == 'failure' && steps.bundle.outcome == 'success'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy apps/web/pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message=MIDIChords-web-health-autodeploy-${{ github.run_id }}
            --commit-dirty=true

      - name: Propagación tras redeploy automático
        if: steps.health1.outcome == 'failure' && steps.deploy.outcome == 'success'
        run: |
          echo "Esperando 120s tras redeploy automático..."
          sleep 120

      - name: Chequeo de salud (intento 2)
        id: health2
        if: steps.health1.outcome == 'failure' && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_production_web_health.py 2>&1 | tee web-health-2.log

      - name: Fallar el job si producción sigue mal
        if: always() && steps.health1.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ "${{ steps.bundle.outcome }}" != "success" ]; then
            echo "::error::No se pudo construir el bundle de Pages para autocuración."
            exit 1
          fi
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "::error::El redeploy automático (wrangler pages deploy) falló."
            exit 1
          fi
          if [ "${{ steps.health2.outcome }}" != "success" ]; then
            echo "::error::Tras el redeploy automático, el 2º chequeo de salud sigue fallando."
            exit 1
          fi
          echo "Autocuración OK: el 2º chequeo pasó tras redeploy."
          exit 0

      - name: Enviar correo (tras fallo del 1er chequeo)
        if: always() && steps.health1.outcome == 'failure'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM_EMAIL }}
          ALERT_TO: ${{ vars.WEB_HEALTH_ALERT_TO }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "RESEND_API_KEY not set — no se envía correo."
            exit 0
          fi
          KIND=action_required
          if [ "${{ steps.bundle.outcome }}" = "success" ] && \
             [ "${{ steps.deploy.outcome }}" = "success" ] && \
             [ "${{ steps.health2.outcome }}" = "success" ]; then
            KIND=resolved
          fi
          ARGS=(web-health-1.log --mail-kind "$KIND")
          if [ -f web-health-2.log ]; then
            ARGS+=(--second-log web-health-2.log)
          fi
          python3 scripts/send_resend_health_alert.py "${ARGS[@]}"
