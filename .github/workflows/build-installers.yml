name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MIDIChords --add-data "assets;assets" app.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          @"
          [Setup]
          AppId={{A4F55F54-4AA1-4A4F-B112-0F7A2755CE16}
          AppName=MIDIChords
          AppVersion=${{ github.ref_name }}
          AppVerName=MIDIChords ${{ github.ref_name }}
          AppPublisher=Antonio Ortega González
          DefaultDirName={autopf}\MIDIChords
          DefaultGroupName=MIDIChords
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=MIDIChords-windows-installer-x64
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"

          [Files]
          Source: "dist\MIDIChords.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\MIDIChords"; Filename: "{app}\MIDIChords.exe"
          Name: "{autodesktop}\MIDIChords"; Filename: "{app}\MIDIChords.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\MIDIChords.exe"; Description: "Launch MIDIChords"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path installer.iss -Encoding UTF8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MIDIChords-windows-installer-x64.exe

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --windowed --name MIDIChords --add-data "assets:assets" app.py

      - name: Build installer (.dmg)
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R dist/MIDIChords.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MIDIChords" -srcfolder dmg-root -ov -format UDZO MIDIChords-macos.dmg

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MIDIChords-macos.dmg

  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev dpkg-dev fakeroot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --name MIDIChords --add-data "assets:assets" app.py

      - name: Build .deb package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKGROOT="package-root"
          mkdir -p "$PKGROOT/DEBIAN"
          mkdir -p "$PKGROOT/opt/midichords"
          mkdir -p "$PKGROOT/usr/share/applications"
          mkdir -p "$PKGROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 dist/MIDIChords "$PKGROOT/opt/midichords/MIDIChords"
          install -m 644 assets/app_logo.png "$PKGROOT/usr/share/icons/hicolor/256x256/apps/midichords.png"

          cat > "$PKGROOT/DEBIAN/control" <<CONTROL
          Package: midichords
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Antonio Ortega González
          Depends: libasound2, libjack-jackd2-0 | libjack0
          Description: MIDI Chords Analyzer desktop application
           Real-time MIDI chord analyzer with staff and piano visualization.
          CONTROL

          cat > "$PKGROOT/usr/share/applications/midichords.desktop" <<DESKTOP
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=MIDI Chords Analyzer
          Comment=Real-time MIDI chord analyzer
          Exec=/opt/midichords/MIDIChords
          Icon=midichords
          Terminal=false
          Categories=Audio;Music;
          DESKTOP

          dpkg-deb --build "$PKGROOT" "MIDIChords-debian-amd64.deb"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MIDIChords-debian-amd64.deb
